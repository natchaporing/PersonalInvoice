# Minimal local Supabase (auth, REST, storage) for development and end-to-end tests.
# Usage: node supabase/local/keys.mjs && docker compose -f supabase/local/docker-compose.yml --env-file supabase/local/.env up -d
# then:  node supabase/local/gateway.mjs   (serves http://localhost:54321 like hosted Supabase)
name: personalinvoice-local
services:
  db:
    image: supabase/postgres:15.8.1.085
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports: ["54322:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      retries: 60
  auth:
    image: supabase/gotrue:v2.177.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Email confirmation is on: mail goes to Mailpit (http://localhost:8025) instead of the internet.
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@personalinvoice.local
      GOTRUE_SMTP_SENDER_NAME: PersonalInvoice
      GOTRUE_SMTP_MAX_FREQUENCY: 2s   # hosted Supabase allows one email per 60s per address; relaxed locally for tests
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3100/**,http://localhost:3200/**,http://localhost:3000/**"
    depends_on: { db: { condition: service_healthy }, mailpit: { condition: service_started } }
    ports: ["9999:9999"]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    ports: ["3001:3000"]
  storage:
    image: supabase/storage-api:v1.25.7
    depends_on: { db: { condition: service_healthy }, rest: { condition: service_started } }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
    ports: ["5000:5000"]
